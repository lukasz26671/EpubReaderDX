name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Blazor WASM
        run: |
          dotnet publish EpubReader.Web/EpubReader.Web.csproj \
            -c Release \
            -o artifacts/web

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="artifacts/web/wwwroot"
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          BASE_HREF="/${REPO_NAME}/"
          if [ "${REPO_NAME}" = "${OWNER}.github.io" ]; then
            BASE_HREF="/"
          fi

          echo "Using base href: ${BASE_HREF}"

          # Rewrite <base href="..."> for project-site path
          python3 - "$SITE_DIR/index.html" "$BASE_HREF" <<'PY'
          import re, sys
          path, base = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          text2, n = re.subn(r'(<base\s+href=["\'])[^"\']*(["\']\s*/?>)', rf'\1{base}\2', text, count=1, flags=re.I)
          if n != 1:
              raise SystemExit(f"Failed to rewrite base href in {path}")
          open(path, "w", encoding="utf-8").write(text2)
          print(f"Updated base href to {base}")
          PY

          # Bust sticky HTML caches: unique comment + ensure fingerprinted CSS/JS landed
          python3 - "$SITE_DIR/index.html" "${{ github.sha }}" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          sha = sys.argv[2][:12]
          text = path.read_text(encoding="utf-8")
          if "<!-- build:" not in text:
              text = text.replace("</head>", f"<!-- build:{sha} -->\n</head>", 1)
          else:
              text = re.sub(r"<!-- build:[^>]*-->", f"<!-- build:{sha} -->", text, count=1)
          # Fail the deploy if publish left unfingerprinted local CSS/JS (would get stuck in cache).
          bad = re.findall(r'(?:href|src)="(?:css|js)/[^"#?]+\.(?:css|js)"', text)
          # Allow only fingerprinted forms: name.{hash}.ext OR leftover placeholder (shouldn't remain)
          leftovers = [b for b in bad if not re.search(r'\.[A-Za-z0-9]{6,}\.(?:css|js)"$', b)]
          if leftovers:
              raise SystemExit(f"Unfingerprinted assets in index.html: {leftovers}")
          path.write_text(text, encoding="utf-8")
          print(f"Stamped build {sha}")
          print("CSS/JS refs:")
          for m in re.finditer(r'(?:href|src)="[^"]+\.(?:css|js)"', text):
              print(" ", m.group(0))
          PY

          # Jekyll must not process _framework
          touch "$SITE_DIR/.nojekyll"

          # SPA fallback for client-side routes
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"

          echo "---- index.html base tag ----"
          grep -n 'base href' "$SITE_DIR/index.html"
          ls -la "$SITE_DIR" | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/web/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
