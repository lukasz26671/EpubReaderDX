name: Release MAUI (Windows + Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 1.0.1). Leave empty to auto-bump from latest tag."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: maui-release
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: EpubReaderDX/EpubReaderDX.csproj

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          else
            LATEST="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [[ -z "${LATEST}" ]]; then
              VERSION="1.0.0"
            else
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<<"${BASE}.0.0"
              PATCH="${PATCH:-0}"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            TAG="v${VERSION}"
          fi

          # Android versionCode: 1.2.3 -> 10203
          IFS='.' read -r A B C <<<"${VERSION}.0.0"
          A="${A:-0}"; B="${B:-0}"; C="${C:-0}"
          VERSION_CODE=$((A * 10000 + B * 100 + C))

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release ${TAG} (versionCode=${VERSION_CODE})"

  build-android:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Publish Android APK
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts/android | Out-Null

          $extra = @(
            "-p:ApplicationDisplayVersion=$env:VERSION",
            "-p:ApplicationVersion=$env:VERSION_CODE"
          )

          if ($env:ANDROID_KEYSTORE_BASE64) {
            $ksPath = Join-Path $env:RUNNER_TEMP "release.keystore"
            [IO.File]::WriteAllBytes($ksPath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $extra += @(
              "-p:AndroidKeyStore=true",
              "-p:AndroidSigningKeyStore=$ksPath",
              "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
              "-p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD",
              "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD"
            )
            Write-Host "Using provided Android release keystore"
          } else {
            Write-Host "No ANDROID_KEYSTORE_* secrets — APK will use debug signing (sideload OK)"
          }

          dotnet publish $env:PROJECT `
            -c Release `
            -f net10.0-android `
            -o artifacts/android `
            @extra

          $apk = Get-ChildItem -Path artifacts/android -Filter *.apk -Recurse | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $apk) { throw "No APK produced" }

          $dest = "artifacts/android/EpubReaderDX-$env:VERSION-android.apk"
          Copy-Item $apk.FullName $dest -Force
          Write-Host "APK: $dest ($([math]::Round($apk.Length/1MB,2)) MB)"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/EpubReaderDX-*-android.apk
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Windows workload
        run: |
          dotnet workload install maui-windows --skip-manifest-update
          dotnet workload install maui-android --skip-manifest-update

      - name: Publish Windows (unpackaged win-x64)
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null

          dotnet publish $env:PROJECT `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:PublishSingleFile=false `
            -p:ApplicationDisplayVersion=$env:VERSION `
            -p:ApplicationVersion=$env:VERSION_CODE `
            -o artifacts/windows/app

          $zip = "artifacts/windows/EpubReaderDX-$env:VERSION-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts/windows/app\*" -DestinationPath $zip -Force
          Write-Host "ZIP: $zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: artifacts/windows/EpubReaderDX-*-win-x64.zip
          if-no-files-found: error

  release:
    needs: [version, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.apk' -o -name '*.zip' \) -print -exec cp -v {} release-assets/ \;
          ls -lah release-assets

      - name: Ensure tag exists (manual runs)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: EpubReaderDX ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*
          body: |
            ## Downloads
            - **Android:** `EpubReaderDX-${{ needs.version.outputs.version }}-android.apk`
            - **Windows x64:** `EpubReaderDX-${{ needs.version.outputs.version }}-win-x64.zip` (unpackaged, self-contained)

            ### Android signing
            If repository secrets `ANDROID_KEYSTORE_*` are not set, the APK is **debug-signed** (fine for sideloading/testing).

            ### Windows
            Unzip and run `EpubReaderDX.exe`. Requires Windows 10 1809+ / Windows 11.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
